name: CI

on:
  push:
    branches:
      - main
      - feat/databricks-productionization

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Databricks Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          files = list(pathlib.Path(".").rglob("*.yml"))
          files += list(pathlib.Path(".").rglob("*.yaml"))

          for path in files:
              if ".git" in path.parts:
                  continue

              with path.open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)

              print(f"OK: {path}")

          print(f"Validated {len(files)} YAML files.")
          PY

      - name: Validate Jupyter notebooks
        run: |
          python - <<'PY'
          import json
          import pathlib

          notebooks = list(pathlib.Path(".").glob("*.ipynb"))

          for path in notebooks:
              with path.open("r", encoding="utf-8") as f:
                  notebook = json.load(f)

              if "cells" not in notebook:
                  raise ValueError(f"{path} has no cells")

              print(f"OK: {path}")

          print(f"Validated {len(notebooks)} notebooks.")
          PY

      - name: Verify required project files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("databricks.yml"),
              Path("resources/streaming_job.yml"),
              Path("resources/serving_job.yml"),
              Path("13_streaming_ingestion.ipynb"),
              Path("14_export_recommendations_to_neon.ipynb"),
              Path("README.md"),
          ]

          missing = [str(path) for path in required if not path.exists()]

          if missing:
              raise SystemExit(
                  "Missing required files:\n" +
                  "\n".join(f"- {path}" for path in missing)
              )

          print("All required project files exist.")
          PY
